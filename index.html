// Deduplicate
const seen = new Set();
const DATA = DATA_RAW.filter(d => { if(seen.has(d.code)) return false; seen.add(d.code); return true; })
  .map(d => ({...d, discount: Math.round((1-d.ptbv)*100)}))
  .sort((a,b) => a.ptbv - b.ptbv);

const SECTORS = ["All", ...new Set(DATA.map(d=>d.sector))].filter((v,i,a)=>a.indexOf(v)===i);

function ptbvColor(v) {
  if(v<=0.2) return "#a78bfa";
  if(v<=0.3) return "#ef4444";
  if(v<=0.4) return "#f59e0b";
  return "#3b82f6";
}

function App() {
  const [sector, setSector] = React.useState("All");
  const [maxPtbv, setMaxPtbv] = React.useState(0.5);
  const [onlyProfit, setOnlyProfit] = React.useState(false);
  const [onlyDiv, setOnlyDiv] = React.useState(false);
  const [sortBy, setSortBy] = React.useState("ptbv");
  const [search, setSearch] = React.useState("");

  const filtered = React.useMemo(() => {
    let d = DATA.filter(x => x.ptbv <= maxPtbv);
    if(sector !== "All") d = d.filter(x => x.sector === sector);
    if(onlyProfit) d = d.filter(x => x.roe > 0);
    if(onlyDiv) d = d.filter(x => x.dy > 0);
    if(search) { const q = search.toLowerCase(); d = d.filter(x => x.name.toLowerCase().includes(q) || x.code.includes(q) || x.sector.toLowerCase().includes(q)); }
    return [...d].sort((a,b) => sortBy==="ptbv" ? a.ptbv-b.ptbv : sortBy==="discount" ? b.discount-a.discount : sortBy==="mcap" ? b.mcap-a.mcap : sortBy==="roe" ? b.roe-a.roe : b.dy-a.dy);
  }, [sector, maxPtbv, onlyProfit, onlyDiv, sortBy, search]);

  const tierCounts = React.useMemo(() => ({
    extreme: DATA.filter(d=>d.ptbv<=0.2).length,
    deep: DATA.filter(d=>d.ptbv>0.2&&d.ptbv<=0.3).length,
    strong: DATA.filter(d=>d.ptbv>0.3&&d.ptbv<=0.4).length,
    notable: DATA.filter(d=>d.ptbv>0.4&&d.ptbv<=0.5).length,
  }), []);

  const pill = (label, val, active, set, activeColor="#3b82f6") => (
    <button onClick={()=>set(val)} style={{padding:"5px 12px",borderRadius:"6px",border:"none",fontSize:"12px",fontWeight:600,
      background:active===val?activeColor:"#334155",color:active===val?"#fff":"#94a3b8"}}>
      {label}
    </button>
  );

  const toggle = (label, val, set, color="#10b981") => (
    <button onClick={()=>set(!val)} style={{padding:"5px 12px",borderRadius:"6px",
      border:`1px solid ${val?color:"#475569"}`,fontSize:"12px",fontWeight:600,
      background:val?`${color}22`:"transparent",color:val?color:"#94a3b8"}}>
      {label}
    </button>
  );

  return (
    <div style={{background:"#0f172a",minHeight:"100vh",color:"#e2e8f0",padding:"24px",fontFamily:"'Inter',system-ui,sans-serif"}}>
      {/* Header */}
      <div style={{marginBottom:"22px"}}>
        <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"10px"}}>
          <div style={{width:"42px",height:"42px",background:"linear-gradient(135deg,#3b82f6,#8b5cf6)",borderRadius:"10px",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:"22px",flexShrink:0}}>📉</div>
          <div>
            <h1 style={{fontSize:"20px",fontWeight:700,color:"#f1f5f9",margin:0}}>Bursa Malaysia — Price vs NTA Screener</h1>
            <p style={{fontSize:"12px",color:"#64748b",margin:0}}>
              Source: KLSE Screener · Screened {new Date().toLocaleDateString("en-MY",{day:"numeric",month:"short",year:"numeric"})} · PTBV ≤ 0.50 · Positive NTA · {DATA.length} stocks
            </p>
          </div>
        </div>
        {/* Tier pills */}
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
          {[["≥80% below NTA",tierCounts.extreme,"#7c3aed"],["70–80% below",tierCounts.deep,"#ef4444"],
            ["60–70% below",tierCounts.strong,"#f59e0b"],["50–60% below",tierCounts.notable,"#3b82f6"]].map(([l,n,c])=>(
            <div key={l} style={{background:`${c}18`,border:`1px solid ${c}44`,borderRadius:"6px",padding:"4px 12px",fontSize:"12px",display:"flex",gap:"6px",alignItems:"center"}}>
              <span style={{color:c,fontWeight:700}}>{n}</span><span style={{color:"#64748b"}}>{l}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Controls */}
      <div style={{background:"#1e293b",borderRadius:"10px",padding:"16px",marginBottom:"16px"}}>
        <div style={{display:"flex",gap:"12px",flexWrap:"wrap",alignItems:"flex-end"}}>
          {/* Search */}
          <div>
            <div style={{fontSize:"11px",color:"#475569",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"6px"}}>Search</div>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Name / code / sector…"
              style={{background:"#0f172a",border:"1px solid #334155",borderRadius:"6px",padding:"5px 10px",color:"#e2e8f0",fontSize:"12px",width:"170px"}}/>
          </div>
          {/* Max PTBV */}
          <div>
            <div style={{fontSize:"11px",color:"#475569",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"6px"}}>Max PTBV</div>
            <div style={{display:"flex",gap:"4px"}}>
              {[0.2,0.3,0.4,0.5].map(v=>pill(v,v,maxPtbv,setMaxPtbv))}
            </div>
          </div>
          {/* Sector */}
          <div>
            <div style={{fontSize:"11px",color:"#475569",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"6px"}}>Sector</div>
            <select value={sector} onChange={e=>setSector(e.target.value)}
              style={{background:"#0f172a",border:"1px solid #334155",borderRadius:"6px",padding:"5px 10px",color:"#e2e8f0",fontSize:"12px"}}>
              {SECTORS.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          {/* Sort */}
          <div>
            <div style={{fontSize:"11px",color:"#475569",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"6px"}}>Sort by</div>
            <div style={{display:"flex",gap:"4px"}}>
              {[["PTBV","ptbv"],["Discount","discount"],["MCap","mcap"],["ROE","roe"],["DY","dy"]].map(([l,v])=>pill(l,v,sortBy,setSortBy,"#8b5cf6"))}
            </div>
          </div>
          {/* Filters */}
          <div>
            <div style={{fontSize:"11px",color:"#475569",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"6px"}}>Filter</div>
            <div style={{display:"flex",gap:"6px"}}>
              {toggle("Profitable",onlyProfit,setOnlyProfit)}
              {toggle("Dividend",onlyDiv,setOnlyDiv,"#f59e0b")}
            </div>
          </div>
          <div style={{marginLeft:"auto",textAlign:"right"}}>
            <div style={{fontSize:"11px",color:"#475569",textTransform:"uppercase",letterSpacing:"0.06em"}}>Showing</div>
            <div style={{fontSize:"20px",fontWeight:700,color:"#f1f5f9"}}>{filtered.length}</div>
          </div>
        </div>
      </div>

      {/* Table */}
      <div style={{background:"#1e293b",borderRadius:"10px",overflow:"hidden"}}>
        <div className="table-wrap">
          <table>
            <thead>
              <tr style={{background:"#0f172a"}}>
                {["#","Name","Code","Sector","Price","NTA","PTBV","Discount","MCap (M)","ROE","DY"].map(h=>(
                  <th key={h} style={{padding:"10px 14px",textAlign:["Name","Sector","#"].includes(h)?"left":"right",
                    color:"#475569",fontWeight:600,fontSize:"11px",textTransform:"uppercase",letterSpacing:"0.06em",
                    whiteSpace:"nowrap",borderBottom:"2px solid #334155"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((d,i)=>{
                const c = ptbvColor(d.ptbv);
                const discW = Math.min(d.discount, 100);
                return (
                  <tr key={d.code} style={{borderBottom:"1px solid #0f172a",background:i%2===0?"#1e293b":"#17253a"}}>
                    <td style={{padding:"9px 14px",color:"#334155",textAlign:"left",fontFamily:"monospace",fontSize:"11px"}}>{i+1}</td>
                    <td style={{padding:"9px 14px",fontWeight:600,whiteSpace:"nowrap"}}>
                      <a href={`https://www.klsescreener.com/v2/stocks/view/${d.code}`} target="_blank" rel="noreferrer">{d.name}</a>
                    </td>
                    <td style={{padding:"9px 14px",color:"#64748b",textAlign:"right",fontFamily:"monospace"}}>{d.code}</td>
                    <td style={{padding:"9px 14px",color:"#64748b",fontSize:"12px",maxWidth:"160px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.sector}</td>
                    <td style={{padding:"9px 14px",textAlign:"right",fontWeight:600,color:"#f1f5f9",fontFamily:"monospace"}}>{d.price.toFixed(3)}</td>
                    <td style={{padding:"9px 14px",textAlign:"right",color:"#34d399",fontFamily:"monospace"}}>{d.nta.toFixed(2)}</td>
                    <td style={{padding:"9px 14px",textAlign:"right"}}>
                      <span style={{background:`${c}20`,color:c,border:`1px solid ${c}50`,borderRadius:"4px",
                        padding:"2px 7px",fontWeight:700,fontFamily:"monospace",fontSize:"12px"}}>{d.ptbv.toFixed(2)}</span>
                    </td>
                    <td style={{padding:"9px 14px",textAlign:"right"}}>
                      <div style={{display:"flex",alignItems:"center",gap:"8px",justifyContent:"flex-end"}}>
                        <div style={{width:"48px",height:"5px",background:"#0f172a",borderRadius:"3px",overflow:"hidden",flexShrink:0}}>
                          <div style={{width:`${discW}%`,height:"100%",background:c,borderRadius:"3px"}}/>
                        </div>
                        <span style={{color:c,fontWeight:700,fontFamily:"monospace",fontSize:"12px",width:"34px",textAlign:"right"}}>{d.discount}%</span>
                      </div>
                    </td>
                    <td style={{padding:"9px 14px",textAlign:"right",color:"#94a3b8",fontFamily:"monospace"}}>{d.mcap>=1000?(d.mcap/1000).toFixed(1)+"B":d.mcap.toFixed(0)+"M"}</td>
                    <td style={{padding:"9px 14px",textAlign:"right",fontFamily:"monospace",
                      color:d.roe>8?"#34d399":d.roe>0?"#86efac":"#f87171"}}>{d.roe.toFixed(1)}%</td>
                    <td style={{padding:"9px 14px",textAlign:"right",fontFamily:"monospace",
                      color:d.dy>3?"#fbbf24":d.dy>0?"#fde68a":"#475569"}}>{d.dy>0?d.dy.toFixed(1)+"%":"—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        {filtered.length===0&&(
          <div style={{padding:"40px",textAlign:"center",color:"#475569"}}>No stocks match the current filters.</div>
        )}
      </div>

      {/* Footer */}
      <div style={{marginTop:"16px",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:"8px"}}>
        <p style={{color:"#334155",fontSize:"11px"}}>
          ⚠️ Data from KLSE Screener. Verify NTA figures before trading. Not financial advice.
        </p>
        <a href="https://www.klsescreener.com/v2/" target="_blank" rel="noreferrer" style={{color:"#475569",fontSize:"11px"}}>
          klsescreener.com →
        </a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
